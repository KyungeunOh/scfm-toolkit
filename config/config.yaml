# =========================================================================
# scFM 어노테이션 툴킷 - 설정 파일
# 연구자가 수정하는 것은 이 파일뿐.
# =========================================================================

# --- 어떤 모델 / 어떤 실행 모드를 쓸지 ---
# model: scgpt 또는 geneformer (adapters/__init__.py의 레지스트리에 등록된 모델만 사용 가능).
#        geneformer는 아직 실제 라이브러리로 실행 검증 전이니 README.md의
#        "Geneformer 지원 (검증 필요)" 절을 먼저 확인할 것. 모델이 다르면 아래 데이터/
#        전처리/학습 파라미터 중 일부(특히 data_is_raw, n_bins 등 scGPT 전용 항목)는
#        의미가 없거나 다르게 해석될 수 있음.
# mode:  현재 finetune_predict만 구현됨. embed / train_head는 config 구조상
#        자리는 마련해두었으나 실행 시 "아직 구현 안 됨" 에러로 안내됨 (로드맵)
model: scgpt
mode: finetune_predict

# --- 입력/출력 경로 (컨테이너 내부 경로, 수정 금지) ---
reference_path: /workspace/data/c_data.h5ad
query_path:     /workspace/data/filtered_ms_adata.h5ad
model_dir:      /workspace/model
output_dir:     /workspace/outputs

# --- Fine-tuned 모델 재사용 (선택) ---
# 이 pipeline은 매번 실행이 끝나면 fine-tune된 가중치를 output_dir/finetuned_model.pt로
# 자동 저장합니다. 같은 reference로 다시 predict만 하고 싶다면(재학습 없이) 여기에
# 그 파일 경로를 지정하세요. 비워두면(기본값 null) 항상 새로 fine-tune합니다.
finetuned_model_path: null

# --- 데이터 설정 ---
celltype_col: celltype
source_celltype_col: "Factor Value[inferred cell type - authors labels]"
data_is_raw: false

# --- 전처리 파라미터 ---
filter_gene_by_counts: false
n_bins: 51

# --- 학습/추론 파라미터 ---
max_seq_len: 3001
batch_size: 8
grad_accum_steps: 4
eval_batch_size: 16
epochs: 10
lr: 0.0001
dropout: 0.2
schedule_ratio: 0.9
train_ratio: 0.9
mask_ratio: 0.0
include_zero_gene: false
amp: true

# --- 예측 신뢰도 경고 ---
# 예측 확률(softmax 최대값)이 이 값보다 낮은 셀은 "불확실"로 표시됩니다
# (predictions.csv의 low_confidence 컬럼, metrics.json의 low_confidence_ratio).
# 비전문가가 낮은 신뢰도 예측을 그대로 믿지 않도록 돕는 안전장치입니다.
# 끄려면 null로 설정하세요.
low_confidence_threshold: 0.5

# --- 재현성 ---
seed: 42
