# =========================================================================
# scFM 어노테이션 툴킷 - 설정 파일
# 연구자가 수정하는 것은 이 파일뿐.
# =========================================================================

# --- 어떤 모델 / 어떤 실행 모드를 쓸지 ---
# model: scgpt 또는 geneformer (adapters/__init__.py의 레지스트리에 등록된 모델만 사용 가능).
#        geneformer는 아직 실제 라이브러리로 실행 검증 전이니 README.md의
#        "Geneformer 지원 (검증 필요)" 절을 먼저 확인할 것. 모델이 다르면 아래 데이터/
#        전처리/학습 파라미터 중 일부(특히 data_is_raw, n_bins 등 scGPT 전용 항목)는
#        의미가 없거나 다르게 해석될 수 있음.
# mode:  finetune_predict(fine-tuning 후 예측) / embed(reference mapping,
#        fine-tuning 없는 zero-shot) / integration(zero-shot batch 통합 품질 평가,
#        아래 참고). train_head는 config 구조상 자리만 있고 아직 미구현.
#        mode: embed/integration일 때는 아래 "학습/추론 파라미터" 대부분이
#        무시된다 (embed는 knn_k/gene_col만, integration은 n_hvg/gene_col만 씀).
model: scgpt
#mode: finetune_predict
#mode: embed
mode: integration

# --- 입력/출력 경로 (컨테이너 내부 경로, 수정 금지) ---
reference_path: /workspace/data/c_data.h5ad
query_path:     /workspace/data/filtered_ms_adata.h5ad
model_dir:      /workspace/model
# output_dir는 이제 "결과가 실제로 쌓이는 최종 경로"가 아니라 base 디렉터리다.
# run.py가 실행마다 output_dir/<model>/<mode>_<YYMMDD>/ 하위 폴더를 자동으로 만들어서
# 그 안에 저장한다 (예: outputs/scgpt/integration_260904, outputs/scgpt/embed_260904).
# model별로 먼저 폴더가 생기고(있으면 재사용) 그 안에 mode_날짜 폴더가 생기는 구조라
# 여러 model/mode를 계속 실행해도 outputs/ 밑이 뒤섞이지 않는다. 같은 날 같은
# model+mode를 다시 실행하면 기존 결과를 덮어쓰지 않고 _2, _3 ... 를 붙인다.
output_dir:     /workspace/outputs

# --- Fine-tuned 모델 재사용 (선택) ---
# 이 pipeline은 매번 실행이 끝나면 fine-tune된 가중치를 output_dir/finetuned_model.pt로
# 자동 저장합니다. 같은 reference로 다시 predict만 하고 싶다면(재학습 없이) 여기에
# 그 파일 경로를 지정하세요. 비워두면(기본값 null) 항상 새로 fine-tune합니다.
finetuned_model_path: null

# --- 데이터 설정 ---
celltype_col: celltype
source_celltype_col: "Factor Value[inferred cell type - authors labels]"
data_is_raw: false

# --- 전처리 파라미터 ---
filter_gene_by_counts: false
n_bins: 51

# --- 학습/추론 파라미터 ---
max_seq_len: 3001
batch_size: 8
grad_accum_steps: 4
eval_batch_size: 16
epochs: 10
lr: 0.0001
dropout: 0.2
schedule_ratio: 0.9
train_ratio: 0.9
mask_ratio: 0.0
include_zero_gene: false
amp: true

# --- mode: embed(reference mapping) 전용 - mode: finetune_predict일 때는 무시됨 ---
# fine-tuning 없이 사전학습 모델로 reference/query를 각각 임베딩한 뒤, 임베딩 공간에서
# k-NN 다수결로 reference의 celltype_col label을 query에 전파합니다
# (scGPT Tutorial_Reference_Mapping.ipynb 방식). reference h5ad에는 celltype_col이
# 반드시 있어야 하고, query h5ad는 평가용으로 있으면 accuracy가 함께 계산되고
# 없어도 예측 자체는 동작합니다(단, 지금은 pipeline/data_io.py의 h5ad 검증 단계가
# query에도 동일한 celltype_col을 요구합니다 - 순수 미지 데이터 매핑은 README 참고).
knn_k: 10          # 다수결에 참여할 이웃 수
gene_col: gene_name  # 유전자 이름이 var의 어느 컬럼/index에 있는지 (scGPT embed_data 인자)

# --- mode: integration(zero-shot batch 통합 품질 평가) 전용 - 다른 mode일 때는 무시됨 ---
# fine-tuning 없이 사전학습 모델 임베딩만으로, 여러 batch(샘플)의 배치 효과가 얼마나
# 잘 제거되고 cell type은 잘 구분되는지 평가합니다 (scGPT
# tutorials/zero-shot/Tutorial_ZeroShot_Integration.ipynb 방식 - GitHub 원본 코드를
# 직접 대조해서 구현). reference/query 구분이 없고, data_path 파일 하나에 celltype_col과
# batch_key(배치/샘플 구분 컬럼)가 둘 다 있어야 합니다.
#
# batch_key 확정 근거: c_data.h5ad의 obs 컬럼들을 직접 확인한 결과, str_batch는 이
# 파일 안에서는 값이 '0' 하나뿐이라(전체가 한 batch) 통합 평가에 못 쓴다. 대신
# "Sample Characteristic[individual]"(기증자/개체 구분)이 9명(C1~C9, 세포 수
# 161~1459개로 고르게 분포)으로 나뉘어 있어 실제 batch effect(개체 간 차이)를 평가하기
# 좋은 후보로 확인됨 - single-cell 통합 벤치마크에서 흔히 쓰는 "donor를 batch로" 방식과
# 동일. (다른 후보였던 "Factor Value[sampling site]"는 뇌 부위 3종 구분이라 이것도
# 가능은 하지만, 개체 간 차이가 더 전형적인 batch effect라 individual을 선택함.)
# 다른 데이터로 바꿀 경우 이 값도 그 데이터의 실제 obs 컬럼에 맞게 다시 확인 필요:
#   python -c "import anndata as ad; print(ad.read_h5ad('/workspace/data/<파일>.h5ad', backed='r').obs.columns.tolist())"
data_path: /workspace/data/c_data.h5ad
batch_key: "Sample Characteristic[individual]"
# n_hvg 참고: c_data.h5ad는 이미 vocab 매칭용으로 3000개 유전자로 줄여진 파일이라
# (mode: embed 실행 결과로 확인됨), n_hvg: 3000이면 사실상 전부를 그대로 쓰는 것과
# 같다(HVG 선택이 유의미하게 줄이지 않음) - 원본 데이터가 큰 raw 데이터라면 이 값을
# 낮춰서(예: 1500) 실제로 서브셋하는 효과를 볼 수 있다.
n_hvg: 3000

# --- 예측 신뢰도 경고 ---
# 예측 확률(softmax 최대값)이 이 값보다 낮은 셀은 "불확실"로 표시됩니다
# (predictions.csv의 low_confidence 컬럼, metrics.json의 low_confidence_ratio).
# 비전문가가 낮은 신뢰도 예측을 그대로 믿지 않도록 돕는 안전장치입니다.
# 끄려면 null로 설정하세요.
low_confidence_threshold: 0.5

# --- 재현성 ---
seed: 42
